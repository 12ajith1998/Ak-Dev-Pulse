<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <filter id="cyanGlowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Backdrop with Cyberpunk Border -->
  <rect width="400" height="400" rx="60" fill="url(#avatarBg)" />

  <!-- Geometric Tech Halo -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="url(#neonRim)" stroke-width="3" stroke-dasharray="14 8 26 6" filter="url(#cyanGlowEffect)" />
  <circle cx="200" cy="200" r="160" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.4" />

  <!-- Code matrix background elements -->
  <g font-family="monospace" font-size="12" fill="#0284c7" opacity="0.35">
    <text x="35" y="70">&lt;dev&gt;</text>
    <text x="310" y="70">{java}</text>
    <text x="35" y="340">01011</text>
    <text x="300" y="340">&lt;/dev&gt;</text>
  </g>

  <!-- Developer Silhouette / Character -->
  <g transform="translate(0, 10)">
    <!-- Shoulders & Tech Hoodie -->
    <path d="M 90 390 C 90 280, 140 250, 200 250 C 260 250, 310 280, 310 390 Z" fill="url(#hoodieGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />
    
    <!-- Neon Hoodie Zipper & Seams -->
    <line x1="200" y1="250" x2="200" y2="390" stroke="#06b6d4" stroke-width="2" filter="url(#cyanGlowEffect)" />
    <path d="M 140 280 L 160 380" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3" />
    <path d="M 260 280 L 240 380" stroke="#0284c7" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Neck -->
    <rect x="180" y="210" width="40" height="50" rx="8" fill="#b45309" />

    <!-- Head / Face Outline -->
    <ellipse cx="200" cy="180" rx="55" ry="65" fill="#d97706" />

    <!-- Stylish Haircut -->
    <path d="M 140 170 C 135 120, 160 100, 200 100 C 240 100, 265 120, 260 170 C 250 120, 230 115, 200 115 C 170 115, 150 130, 140 170 Z" fill="#18181b" stroke="#0f172a" stroke-width="2" />
    <path d="M 148 135 C 160 115, 185 110, 215 112 C 245 115, 255 125, 258 140 C 240 125, 220 122, 195 124 C 170 126, 158 132, 148 135 Z" fill="#27272a" />

    <!-- Eyebrows -->
    <path d="M 165 160 Q 180 155 190 160" stroke="#1c1917" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M 210 160 Q 220 155 235 160" stroke="#1c1917" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Modern Smart Glasses / AR Developer Specs -->
    <rect x="156" y="165" width="38" height="24" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#22d3ee" stroke-width="2" filter="url(#cyanGlowEffect)" />
    <rect x="206" y="165" width="38" height="24" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#22d3ee" stroke-width="2" filter="url(#cyanGlowEffect)" />
    <line x1="194" y1="177" x2="206" y2="177" stroke="#22d3ee" stroke-width="2" />
    
    <!-- AR Glass Reflection Line -->
    <line x1="160" y1="184" x2="175" y2="169" stroke="#67e8f9" stroke-width="1.5" stroke-linecap="round" />
    <line x1="210" y1="184" x2="225" y2="169" stroke="#67e8f9" stroke-width="1.5" stroke-linecap="round" />

    <!-- Nose & Confident Smile -->
    <path d="M 200 185 L 197 197 L 203 197" stroke="#92400e" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 188 212 Q 200 222 212 212" stroke="#451a03" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Professional Studio Headphones -->
    <path d="M 135 180 C 135 110, 265 110, 265 180" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" />
    <!-- Earcups -->
    <rect x="130" y="165" width="14" height="42" rx="7" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <rect x="256" y="165" width="14" height="42" rx="7" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Bottom Tech Badge -->
  <g transform="translate(145, 355)">
    <rect x="0" y="0" width="110" height="26" rx="13" fill="#020617" stroke="#06b6d4" stroke-width="1.5" />
    <circle cx="14" cy="13" r="4" fill="#10b981" />
    <text x="25" y="17" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">FULL-STACK</text>
  </g>
</svg>
