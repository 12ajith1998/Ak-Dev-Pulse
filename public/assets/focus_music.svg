<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="neonSunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <radialGradient id="deskGlow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="1200" height="400" fill="url(#nightSky)" />

  <!-- Distant City Skyline Silhouettes -->
  <g fill="#0b0f19" opacity="0.9">
    <rect x="50" y="180" width="60" height="220" />
    <rect x="130" y="140" width="80" height="260" />
    <rect x="230" y="200" width="45" height="200" />
    <rect x="300" y="110" width="90" height="290" />
    <polygon points="345,70 300,110 390,110" />
    <line x1="345" y1="50" x2="345" y2="70" stroke="#f43f5e" stroke-width="2" />
    
    <rect x="420" y="170" width="70" height="230" />
    <rect x="510" y="130" width="110" height="270" />
    <rect x="640" y="190" width="60" height="210" />
    <rect x="720" y="150" width="85" height="250" />
    <rect x="830" y="100" width="95" height="300" />
    <line x1="877" y1="55" x2="877" y2="100" stroke="#38bdf8" stroke-width="2" />
    
    <rect x="950" y="160" width="80" height="240" />
    <rect x="1050" y="120" width="90" height="280" />
  </g>

  <!-- Distant City Windows & Neon Signs -->
  <g fill="#fef08a" opacity="0.35">
    <circle cx="150" cy="180" r="1.5" />
    <circle cx="170" cy="220" r="1.5" />
    <circle cx="330" cy="150" r="1.5" />
    <circle cx="350" cy="190" r="1.5" />
    <circle cx="530" cy="160" r="1.5" />
    <circle cx="560" cy="200" r="1.5" />
    <circle cx="850" cy="130" r="1.5" />
    <circle cx="870" cy="180" r="1.5" />
    <circle cx="1070" cy="160" r="1.5" />
  </g>
  <g fill="#38bdf8" opacity="0.4">
    <rect x="330" y="240" width="30" height="6" rx="2" />
    <rect x="740" y="210" width="40" height="6" rx="2" fill="#ec4899" />
    <rect x="970" y="220" width="35" height="5" rx="2" fill="#a855f7" />
  </g>

  <!-- Large Studio Window Pane with Rain Streaks -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.15">
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="0" y1="120" x2="1200" y2="120" />
  </g>
  <!-- Raindrops on glass -->
  <g stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" stroke-linecap="round">
    <line x1="120" y1="80" x2="116" y2="110" />
    <line x1="280" y1="40" x2="276" y2="75" />
    <line x1="460" y1="90" x2="456" y2="125" />
    <line x1="680" y1="30" x2="676" y2="68" />
    <line x1="910" y1="70" x2="906" y2="105" />
    <line x1="1120" y1="45" x2="1116" y2="80" />
  </g>

  <!-- Cozy Ambient Desk Glow -->
  <rect x="0" y="280" width="1200" height="120" fill="url(#deskGlow)" />
  <rect x="0" y="320" width="1200" height="80" fill="#030712" />

  <!-- Studio Audio Visualizer Waveform Graphic (Synthesizer Waves) -->
  <g transform="translate(420, 260)" filter="url(#softGlow)">
    <path d="M 0 50 Q 40 10 80 50 T 160 50 T 240 50 T 320 50 T 400 50 T 480 50 T 560 50 T 640 50" fill="none" stroke="url(#neonSunset)" stroke-width="4" stroke-linecap="round" />
  </g>
  <g transform="translate(420, 260)">
    <path d="M 0 50 Q 30 20 60 50 T 120 50 T 180 50 T 240 50 T 300 50 T 360 50 T 420 50 T 480 50 T 540 50 T 600 50 T 660 50" fill="none" stroke="#22d3ee" stroke-width="2" stroke-opacity="0.7" />
  </g>

  <!-- Left: Cozy Warm Lamp Glow & Headphones Setup -->
  <g transform="translate(80, 200)">
    <!-- Desk Lamp -->
    <path d="M 40 120 L 40 40 L 90 20" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none" />
    <polygon points="80,10 115,25 95,45" fill="#f59e0b" />
    <ellipse cx="115" cy="45" rx="30" ry="15" fill="#fef08a" fill-opacity="0.3" filter="url(#softGlow)" />

    <!-- Audio Monitor Speaker -->
    <rect x="130" y="30" width="60" height="90" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="2" />
    <circle cx="160" cy="55" r="12" fill="#020617" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="160" cy="90" r="18" fill="#020617" stroke="#06b6d4" stroke-width="2" />
    <circle cx="160" cy="90" r="6" fill="#06b6d4" />
  </g>

  <!-- Right: Secondary Monitor & Headphones -->
  <g transform="translate(980, 220)">
    <!-- Studio Headphone resting on stand -->
    <path d="M 50 100 L 50 20" stroke="#475569" stroke-width="3" fill="none" />
    <path d="M 25 35 C 25 10, 75 10, 75 35" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round" />
    <rect x="18" y="30" width="14" height="24" rx="5" fill="#0284c7" />
    <rect x="68" y="30" width="14" height="24" rx="5" fill="#0284c7" />
  </g>

  <!-- Ambient Equalizer Bars (Center Stage) -->
  <g transform="translate(280, 310)" fill="#38bdf8" opacity="0.8">
    <rect x="0" y="-30" width="6" height="30" rx="3" fill="#06b6d4" />
    <rect x="10" y="-45" width="6" height="45" rx="3" fill="#3b82f6" />
    <rect x="20" y="-20" width="6" height="20" rx="3" fill="#8b5cf6" />
    <rect x="30" y="-60" width="6" height="60" rx="3" fill="#ec4899" />
    <rect x="40" y="-35" width="6" height="35" rx="3" fill="#a855f7" />
    <rect x="50" y="-15" width="6" height="15" rx="3" fill="#3b82f6" />
  </g>
</svg>
