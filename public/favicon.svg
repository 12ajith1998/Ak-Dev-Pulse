<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#082f49" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="favPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cockpit Base -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Corner Tech Accents -->
  <line x1="8" y1="14" x2="8" y2="8" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
  <line x1="8" y1="8" x2="14" y2="8" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" />
  <line x1="56" y1="50" x2="56" y2="56" stroke="#10b981" stroke-width="2" stroke-linecap="round" />
  <line x1="56" y1="56" x2="50" y2="56" stroke="#10b981" stroke-width="2" stroke-linecap="round" />

  <!-- Dev Pulse / Heartbeat Line Waveform -->
  <path
    d="M 10 34 L 20 34 L 25 21 L 32 46 L 38 18 L 44 38 L 48 34 L 54 34"
    fill="none"
    stroke="url(#favPulse)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#favGlow)"
  />

  <!-- Active Telemetry Heartbeat Beacon Dot -->
  <circle cx="48" cy="34" r="3" fill="#22d3ee" filter="url(#favGlow)" />
  <circle cx="48" cy="34" r="1.5" fill="#ffffff" />
</svg>
